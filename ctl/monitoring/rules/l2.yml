# DOC-05 §2, §3.1, §8 / DOC-07 RB-07, RB-08: the L2 layer (pgBackRest on db-1, bucket B), as
# ctl-1 reads it (ctlplane/l2.py; 0 = never) and as db-1 reports its archiver (ctlplane/agent_api.py).
# db-1 runs `pgbackrest check` every 2 minutes, which switches WAL, so even an idle cluster stores a
# segment within minutes.
groups:
  - name: l2
    rules:
      # The archive lag itself, from db-1's WAL archiver (reported with each agent poll): the oldest
      # finished segment still waiting (.ready) is the lag; its count is pressure on its own.
      - alert: L2WalArchiveLag
        expr: ctl_l2_archive_oldest_pending_seconds > 5 * 60
        labels:
          severity: sev2
          runbook: RB-08
        annotations:
          summary: "WAL archive lag over 5 minutes on db-1 ({{ $labels.host_id }})"
          description: "The oldest WAL segment waiting to be archived finished {{ $value | humanizeDuration }} ago. The cluster-loss RPO is at least that."
      - alert: L2WalArchiveBacklog
        expr: ctl_l2_archive_pending_segments >= 5
        for: 5m
        labels:
          severity: sev3
          runbook: RB-08
        annotations:
          summary: "WAL archive backlog on db-1 ({{ $labels.host_id }})"
          description: "{{ $value }} finished WAL segments waiting to be archived for 5 minutes: archiving is slower than the writes."
      - alert: L2WalNeverArchived
        expr: ctl_l2_archived_age_seconds < 0
        for: 10m
        labels:
          severity: sev2
          runbook: RB-08
        annotations:
          summary: "db-1 has never archived a WAL segment ({{ $labels.host_id }})"
          description: "pg_stat_archiver shows no archived segment: archive_mode or archive_command isn't working."
      - alert: L2ArchiverSilent
        expr: time() - ctl_l2_archiver_report_timestamp_seconds > 10 * 60
        for: 2m
        labels:
          severity: sev2
          runbook: RB-08
        annotations:
          summary: "db-1 isn't reporting its WAL archiver ({{ $labels.host_id }})"
          description: "No archiver report with db-1's polls for {{ $value | humanizeDuration }} (or never): the archive lag alerts are blind (agentd down, an old agent, or its query failing)."
      - alert: L2ArchiveQueueUnreported
        expr: ctl_l2_archive_queue_reported == 0
        for: 15m
        labels:
          severity: sev3
          runbook: RB-08
        annotations:
          summary: "db-1 reports no WAL archive queue ({{ $labels.host_id }})"
          description: "db-1's archiver reports come without the queue of waiting segments (an older agent): the archive lag and backlog alerts can't fire. Upgrade its agent."
      # The repository end to end: the newest segment stored in bucket B (db-1's check timer
      # switches WAL every 2 minutes). Late uploads of old segments keep this fresh: the lag
      # alerts above are the ones that see that.
      - alert: L2WalUploadStale
        expr: time() - ctl_l2_wal_last_timestamp_seconds > 15 * 60 and time() - ctl_l2_checked_timestamp_seconds < 15 * 60
        labels:
          severity: sev2
          runbook: RB-08
        annotations:
          summary: "No WAL stored in bucket B for 15 minutes (stanza {{ $labels.stanza }})"
          description: "The newest WAL segment in bucket B was stored {{ $value | humanizeDuration }} ago: db-1's archive-push or its check timer is failing."
      - alert: L2FullStale
        expr: time() - ctl_l2_full_last_timestamp_seconds > 8 * 86400
        labels:
          severity: sev2
          runbook: RB-08
        annotations:
          summary: "No L2 full backup for 8 days (stanza {{ $labels.stanza }})"
          description: "The newest full pgBackRest backup is {{ $value | humanizeDuration }} old (weekly, Sunday 01:00 UTC)."
      - alert: L2BackupStale
        expr: time() - ctl_l2_backup_last_timestamp_seconds > 26 * 3600
        labels:
          severity: sev2
          runbook: RB-08
        annotations:
          summary: "No L2 differential or full backup for 26 hours (stanza {{ $labels.stanza }})"
          description: "The newest full or differential pgBackRest backup is {{ $value | humanizeDuration }} old (daily, 01:00 UTC)."
      - alert: L2Unread
        expr: time() - ctl_l2_checked_timestamp_seconds > 15 * 60
        labels:
          severity: sev2
          runbook: RB-08
        annotations:
          summary: "ctl-1 can't read the L2 repository (stanza {{ $labels.stanza }})"
          description: "The last successful read of bucket B was {{ $value | humanizeDuration }} ago: the other L2 alerts are blind until it works (ctl's l2 worker logs say why)."
      - alert: L2ExpireStale
        expr: time() - ctl_l2_expire_last_timestamp_seconds > 3 * 86400
        labels:
          severity: sev3
          runbook: RB-08
        annotations:
          summary: "pgBackRest expire hasn't run for 3 days (stanza {{ $labels.stanza }})"
          description: "The last expire on ctl-1 succeeded {{ $value | humanizeDuration }} ago: bucket B keeps growing past two full cycles."
