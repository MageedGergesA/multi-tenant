# promtool test rules monitoring/rules/controlplane_test.yml
rule_files:
  - controlplane.yml
evaluation_interval: 1m
tests:
  # Dumped and anchored at t=0, then nothing: quiet at 25 h, both firing past 26 h.
  - interval: 1h
    input_series:
      - series: 'ctl_controlplane_dump_last_timestamp_seconds'
        values: '0+0x30'
      - series: 'ctl_audit_anchor_last_timestamp_seconds'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 25h
        alertname: ControlPlaneDumpMissing
        exp_alerts: []
      - eval_time: 25h
        alertname: AuditAnchorMissing
        exp_alerts: []
      - eval_time: 27h
        alertname: ControlPlaneDumpMissing
        exp_alerts:
          - exp_labels: {severity: sev2, runbook: RB-10}
            exp_annotations:
              summary: "No control-plane dump in bucket C for 26 hours"
              description: "The newest control-plane dump is 1d 3h 0m 0s old."
      - eval_time: 27h
        alertname: AuditAnchorMissing
        exp_alerts:
          - exp_labels: {severity: sev1, runbook: RB-09}
            exp_annotations:
              summary: "No audit hash anchor in bucket C for 26 hours"
              description: "The newest audit anchor is 1d 3h 0m 0s old: investigate as a compromise."
  # Daily dumps and anchors: quiet.
  - interval: 1d
    input_series:
      - series: 'ctl_controlplane_dump_last_timestamp_seconds'
        values: '0+86400x5'
      - series: 'ctl_audit_anchor_last_timestamp_seconds'
        values: '0+86400x5'
    alert_rule_test:
      - eval_time: 4d
        alertname: ControlPlaneDumpMissing
        exp_alerts: []
      - eval_time: 4d
        alertname: AuditAnchorMissing
        exp_alerts: []
  # Drilled at t=0: quiet at 91 days, firing past 92. No dump yet (0): quiet.
  - interval: 1d
    input_series:
      - series: 'ctl_controlplane_drill_last_pass_timestamp_seconds'
        values: '0+0x100'
    alert_rule_test:
      - eval_time: 95d
        alertname: ControlPlaneNotDrilled
        exp_alerts: []
  - interval: 1d
    input_series:
      - series: 'ctl_controlplane_drill_last_pass_timestamp_seconds'
        values: '86400+0x100'
    alert_rule_test:
      - eval_time: 92d
        alertname: ControlPlaneNotDrilled
        exp_alerts: []
      - eval_time: 94d
        alertname: ControlPlaneNotDrilled
        exp_alerts:
          - exp_labels: {severity: sev3, runbook: RB-10}
            exp_annotations:
              summary: "Control-plane drill due: none passed in 92 days"
              description: "The last control-plane drill passed 93d 0h 0m 0s ago: restore the newest bucket C dump onto a temporary server."
