---
# db-1 (ADR-004, DOC-05): PostgreSQL 16 for the tenants and the host agent (role db).
# The server is infra/tofu. A new host needs its enrollment opened on ctl-1 first (README).
- name: Configure db-1
  hosts: db
  become: true
  roles:
    - base
    - wireguard
    - db_host
    - role: pgbackrest   # L2: WAL and the full/differential backups to bucket B (DOC-05 §2)
      vars:
        pgbackrest_mode: db
    - agent
