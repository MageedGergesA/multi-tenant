---
# Restarting it stops ctl (BindsTo=); the play starts ctl again at the end.
- name: Restart ctl-secrets
  ansible.builtin.systemd_service:
    name: ctl-secrets
    state: restarted
    daemon_reload: true
  # Not on a new host whose key the SOPS file doesn't have yet; the tasks explain.
  failed_when: false
